# /etc/wireguard/wg0.conf —— edge（新加坡腾讯云），监听方
#
# 部署：
#   install -d -m 700 /etc/wireguard
#   (umask 077; wg genkey > /etc/wireguard/edge.key)
#   wg pubkey < /etc/wireguard/edge.key > /etc/wireguard/edge.pub
#   把本文件放到 /etc/wireguard/wg0.conf，chmod 600
#   systemctl enable --now wg-quick@wg0
#
# 腾讯云安全组要放行 UDP 51820 入站，否则对端的握手包到不了主机
# （主机防火墙干净也没用，包在云平台那一层就被丢了）。

[Interface]
Address    = 10.8.0.1/24
ListenPort = 51820
# 私钥不写进本文件，改由 PostUp 从单独的 key 文件注入。
# 这样这份配置可以直接进版本库，密钥只存在于一个 600 的文件里。
PostUp     = wg set %i private-key /etc/wireguard/edge.key

[Peer]
# backend（宿迁京东云）。它在 NAT 后面且不开任何入站，
# 所以这里不写 Endpoint —— 地址由它第一次握手时自己带过来。
PublicKey  = <把 backend.pub 的内容填进来>
AllowedIPs = 10.8.0.2/32
