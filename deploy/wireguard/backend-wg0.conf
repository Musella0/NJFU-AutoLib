# /etc/wireguard/wg0.conf —— backend（宿迁京东云），主动握手方
#
# 部署：
#   install -d -m 700 /etc/wireguard
#   (umask 077; wg genkey > /etc/wireguard/backend.key)
#   wg pubkey < /etc/wireguard/backend.key > /etc/wireguard/backend.pub
#   把本文件放到 /etc/wireguard/wg0.conf，chmod 600
#   systemctl enable --now wg-quick@wg0
#
# 京东云安全组不用开任何入站：握手和保活都由本机先发出去，
# 回包沿着 NAT 映射原路返回。

[Interface]
Address = 10.8.0.2/24
PostUp  = wg set %i private-key /etc/wireguard/backend.key
# MTU 不用手填：wg-quick 按出口网卡自动算。京东云 eth0 是 1450，减 80 → wg0 得 1370，
# 实测正确。只有在「ping 通但大响应体卡死」时才需要手动往下调。
# MTU = 1370

[Peer]
# edge（新加坡腾讯云）
PublicKey           = <把 edge.pub 的内容填进来>
Endpoint            = <edge 的公网 IP>:51820
# 只把对面这一个地址路由进隧道，别的流量（webvpn、镜像源）照常走公网。
AllowedIPs          = 10.8.0.1/32
# 保活：让 NAT 映射不过期，断网恢复后也能自己接上
PersistentKeepalive = 25
