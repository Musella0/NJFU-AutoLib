# ============================================================================
# edge（新加坡）—— 只跑 Caddy 的公网门卫
#
# 后端（mongo / flask-api / scheduler）全部在宿迁那台，经 WireGuard 隧道访问。
# 用法：
#     API_UPSTREAM=10.8.0.2:5004 docker compose -p autolib -f docker-compose.edge.yml up -d
#
# -p autolib 必须带上：现网 project 就叫这个名字，省掉它会另起一套网络和卷，
# 新签的证书也进不了原来的 caddy_data，等于白白重签一次。
# ============================================================================
services:
  caddy:
    image: caddy:2-alpine
    container_name: autolib-caddy
    restart: unless-stopped
    environment:
      # 不给默认值：忘了设就直接启动失败，好过悄悄回落到本机不存在的
      # flask-api 容器，然后让用户对着 502 猜半天。
      - API_UPSTREAM=${API_UPSTREAM:?edge 模式必须指定后端地址，例如 API_UPSTREAM=10.8.0.2:5004}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # APK 下载目录：只暴露这一个目录，仓库其他文件不可达
      - ./downloads:/srv/downloads:ro
      # 静态资源本机直出（见 Caddyfile 的 handle_path /static/*）
      - ./backend/static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config

  # 开闸那一刻钟的秒级占用采样（utils/seat_rush_probe.py）。7:00 这台闲着，
  # 而且和抢座不同机不同出口，12 路并发也不会跟下单抢带宽。07:30 之后每半小时
  # 那张由 backend 的 scheduler 补，这边白天不发请求。
  # 结果穿隧道直接写 backend 的 mongo（见 docker-compose.backend.yml）。
  probe:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: autolib-probe
    restart: unless-stopped
    command: python -m utils.seat_rush_probe --daily --every 0
    environment:
      - DB_IP=${PROBE_DB_IP:?edge 模式必须指定隧道对面的 mongo，例如 PROBE_DB_IP=10.8.0.2:27017}
      - MONGO_USER=${MONGO_USER:-autolib}
      - MONGO_PASS=${MONGO_PASS:-autolib123}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - SEAT_SNAPSHOT_PID=${SEAT_SNAPSHOT_PID:-}
      - LOG_FILE=logs/auto_lib.log
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1

volumes:
  # 与 docker-compose.yml 同名。配合 -p autolib 复用现网那两个卷，
  # 已签发的证书和 OCSP 缓存原地保留。
  caddy_data:
  caddy_config:
